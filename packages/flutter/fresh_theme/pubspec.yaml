name: fresh_theme
description: Fresh Orbit Flutter theme generated from @fresh/design-tokens (packages/design-tokens/tokens.json).
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

# The owner's real scenery pictures (D287): the fishing trawler and three gulls, transparent PNGs. Loaded with
# `package: 'fresh_theme'` (FreshSceneryPictures), so every app that uses the theme gets them.
flutter:
  assets:
    - assets/scenery/
