# Builds multi-arch images (linux/amd64 + linux/arm64), pushes them to GHCR and deploys them to a server over SSH.
# Runbook: docs/runbooks/deploy.md. CI (build, tests, lint) stays in ci.yml.
#
# Triggers
#   - push of a tag v*            → build that tag and deploy it to `staging`
#   - manual (workflow_dispatch)  → build this commit (tag sha-<short>) or redeploy an existing tag, to the chosen
#                                   environment
#
# GitHub settings (nothing secret lives in this file):
#   Environments `staging` and `production` (Settings → Environments). Add "Required reviewers" to get a manual
#   approval before the deploy job runs.
#   Environment secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (private key of the deploy user),
#                        DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan -t ed25519 <host>`; recommended),
#                        DEPLOY_SSH_PORT (optional, default 22)
#   Environment variables: DOMAIN (e.g. freshorbit.in), DEPLOY_PATH (optional, default /opt/freshorbit)
#   Repository variables: SITE_URL_STAGING, SITE_URL_PRODUCTION (e.g. https://freshorbit.in). The website image inlines
#                         its public URL (NEXT_PUBLIC_SITE_URL) at build time, so images are built per environment:
#                         production builds get a `-prod` suffix and only `-prod` tags may go to production.
# Images: ghcr.io/mosasivamani/fresh-orbit-{api,worker,migrations,web,admin}:<tag>

name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: >-
          Existing image tag to redeploy (e.g. v1.2.0, or v1.2.0-prod for production). Leave empty to build the
          selected ref for the chosen environment.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/mosasivamani/fresh-orbit

jobs:
  release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
      site_url: ${{ steps.tag.outputs.site_url }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          TARGET: ${{ inputs.environment || 'staging' }}
          SITE_URL_STAGING: ${{ vars.SITE_URL_STAGING }}
          SITE_URL_PRODUCTION: ${{ vars.SITE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"; build=false
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"; build=true
          else
            tag="sha-${SHA:0:7}"; build=true
          fi
          if [[ "$TARGET" == production ]]; then
            site_url="$SITE_URL_PRODUCTION"
            [[ $build == false || "$tag" == *-prod ]] || tag="$tag-prod"
            if [[ "$tag" != *-prod ]]; then
              echo "::error::Only -prod images (built with the production site URL) can be deployed to production."
              exit 1
            fi
          else
            site_url="$SITE_URL_STAGING"
            if [[ "$tag" == *-prod ]]; then
              echo "::error::A -prod image carries the production site URL; build the ref for staging instead."
              exit 1
            fi
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Invalid image tag '$tag'."
            exit 1
          fi
          if [[ $build == true && ! "$site_url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Repository variable SITE_URL_${TARGET^^} must be set to https://<host> (no path)."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "site_url=$site_url"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag (build: $build)" >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Build ${{ matrix.image }}
    needs: release
    if: needs.release.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, worker, migrations, web, admin]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ needs.release.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.tag }}
          # The website's public URL, inlined at build time by Next.js (ignored by the other images). The admin needs
          # none: it calls the API on its own origin through Caddy.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ needs.release.outputs.site_url }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: [release, images]
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: https://${{ vars.DOMAIN }}
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/freshorbit' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret $name is not set for this environment."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [[ -n "${DEPLOY_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS is not set; trusting the host key on first use."
            ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
          EOF

      - name: Copy infra files to the server
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029 # values are expanded here on purpose (validated tag, our own path)
          # Tracked files only; the server's .env.prod and rclone.conf are never overwritten.
          tar -czf - infra/compose/docker-compose.prod.yml infra/compose/.env.prod.example \
            infra/caddy infra/scripts infra/monitoring \
            | ssh deploy-target "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH'"

      - name: Log the server in to GHCR for this deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh deploy-target "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

      - name: Deploy ${{ needs.release.outputs.tag }}
        run: |
          # shellcheck disable=SC2029
          ssh deploy-target "'$DEPLOY_PATH/infra/scripts/deploy.sh' '$TAG'"

      - name: Log the server out of GHCR
        if: always()
        run: ssh deploy-target "docker logout ghcr.io" || true

      - name: Summary
        if: success()
        run: echo "Deployed \`$TAG\` to ${{ inputs.environment || 'staging' }} (https://${{ vars.DOMAIN }})." >> "$GITHUB_STEP_SUMMARY"
