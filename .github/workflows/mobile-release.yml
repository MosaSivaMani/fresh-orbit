# Store build of the Android app for Google Play (D309, gap audit MA-7, L-22; checks D337). Manual only:
# Actions › Mobile release › Run workflow, on main (or a v* tag).
#
# - A signed App Bundle (.aab) with the owner's upload key (D297); without the key secrets the run stops (rule 7:
#   never the debug key). Owner steps: docs/runbooks/mobile-release.md, part 2 and "Store build".
# - Dart code obfuscated (--obfuscate); the symbol files (--split-debug-info) are kept as a separate artifact for
#   90 days, so a stack trace from a crash report can be read back with `flutter symbolize`.
# - The version name comes from pubspec.yaml; the build number (Android versionCode) is the run number plus an
#   offset, so every upload is higher than the last one.
# - Addresses are repository variables, never defaults (rule 7): API_BASE_URL, WEBSITE_BASE_URL (D299),
#   APP_LINK_HOST (App Links, D308) and the optional CRASH_REPORT_DSN (D309).
# - Refused before anything is built (D337): a ref other than main or a v* tag, a missing secret or variable, an
#   address that is not https://<host>, a keystore that does not open with its password and alias. After the build,
#   the bundle's certificate must be the upload key's. The decoded key is deleted at the end.
# - Actions are pinned to commit SHAs like deploy.yml (L-35): this workflow holds the upload key. A pull request that
#   changes this file only runs actionlint on it (no secrets, no build).
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      build-number-offset:
        description: Added to the run number to give the build number (raise it if Play reports a used versionCode)
        required: false
        default: '100'
  pull_request:
    paths:
      - .github/workflows/mobile-release.yml

concurrency:
  group: mobile-release-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Check the release workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/mobile-release.yml

  bundle:
    name: Build signed App Bundle
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check the configuration
        working-directory: .
        env:
          REF: ${{ github.ref }}
          OFFSET: ${{ inputs.build-number-offset }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          failed=false
          if [[ "$REF" != refs/heads/main && "$REF" != refs/tags/v* ]]; then
            echo "::error title=Wrong ref::Build store releases only from main or a v* tag (this run is on $REF)."
            failed=true
          fi
          if [[ ! "$OFFSET" =~ ^[0-9]+$ ]]; then
            echo "::error title=Build number offset::build-number-offset must be a whole number (got '$OFFSET')."
            failed=true
          fi
          missing=""
          [ -n "$API_BASE_URL" ] || missing="$missing vars.API_BASE_URL"
          [ -n "$WEBSITE_BASE_URL" ] || missing="$missing vars.WEBSITE_BASE_URL"
          [ -n "$UPLOAD_KEYSTORE_BASE64" ] || missing="$missing secrets.UPLOAD_KEYSTORE_BASE64"
          [ -n "$UPLOAD_KEYSTORE_PASSWORD" ] || missing="$missing secrets.UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$UPLOAD_KEY_ALIAS" ] || missing="$missing secrets.UPLOAD_KEY_ALIAS"
          [ -n "$UPLOAD_KEY_PASSWORD" ] || missing="$missing secrets.UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Release not configured::Missing:$missing (docs/runbooks/mobile-release.md, Store build)."
            failed=true
          fi
          for name in API_BASE_URL WEBSITE_BASE_URL; do
            value="${!name}"
            if [ -n "$value" ] && [[ ! "$value" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
              echo "::error title=Address::vars.$name must be https://<host> with no path (got '$value')."
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/fresh-orbit-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$store"
          chmod 600 "$store"
          # The key must open with the given password and alias before a long build starts.
          if ! keytool -list -keystore "$store" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null; then
            echo "::error title=Upload key unreadable::UPLOAD_KEYSTORE_BASE64 does not open with UPLOAD_KEYSTORE_PASSWORD, or has no alias UPLOAD_KEY_ALIAS."
            exit 1
          fi
          expected=$(keytool -list -v -keystore "$store" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          {
            echo "FRESH_ORBIT_UPLOAD_STORE_FILE=$store"
            echo "FRESH_ORBIT_UPLOAD_STORE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD"
            echo "FRESH_ORBIT_UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
            echo "FRESH_ORBIT_UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
            echo "UPLOAD_CERT_SHA256=$expected"
          } >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build the App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          CRASH_REPORT_DSN: ${{ vars.CRASH_REPORT_DSN }}
          FRESH_ORBIT_APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
          OFFSET: ${{ inputs.build-number-offset }}
        run: |
          build_number=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          flutter build appbundle --release \
            --build-number="$build_number" \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEBSITE_BASE_URL="$WEBSITE_BASE_URL" \
            --dart-define=CRASH_REPORT_DSN="$CRASH_REPORT_DSN" \
            --dart-define=APP_ENVIRONMENT=Production
          {
            echo "### Store build"
            echo "Build number (versionCode): \`$build_number\`"
            echo "API: $API_BASE_URL"
            [ -n "$FRESH_ORBIT_APP_LINK_HOST" ] || echo "App Links: not configured (vars.APP_LINK_HOST is empty), website links open the browser."
            [ -n "$CRASH_REPORT_DSN" ] || echo "Crash reports: device log only (vars.CRASH_REPORT_DSN is empty)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the bundle is signed with the upload key
        run: |
          set -euo pipefail
          actual=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [[ -z "$actual" || "$actual" != "$UPLOAD_CERT_SHA256" ]]; then
            echo "::error title=Wrong signature::The bundle is not signed with the upload key (bundle '$actual', key '$UPLOAD_CERT_SHA256')."
            exit 1
          fi
          # Its SHA-256 goes into assetlinks.json only if Play App Signing is off.
          echo "Upload certificate SHA-256: \`$actual\` (Play Console › App integrity shows the same upload key)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-orbit-${{ env.BUILD_NUMBER }}-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fresh-orbit-${{ env.BUILD_NUMBER }}-debug-info
          path: apps/mobile/build/debug-info
          if-no-files-found: error
          retention-days: 90
      - name: Remove the decoded key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/fresh-orbit-upload.jks"
