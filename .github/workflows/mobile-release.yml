# Signed Android App Bundle (AAB) for Google Play (L-22, L-80, D337). Owner steps: docs/runbooks/mobile-release.md
# part 2 (upload key) and part 3 (this workflow); store listing and data-safety answers: docs/runbooks/play-store.md.
#
# Manual only: Actions › Mobile release AAB › Run workflow on `main` (or a `v*` tag), with the version name (e.g.
# 1.0.0). The version code is this workflow's run number, so every bundle has a higher one than the last (Play refuses
# a repeated version code).
#
# Everything comes from the GitHub environment `play-release` (Settings › Environments; restrict it to `main` and
# tags, add yourself as Required reviewer):
#   secrets   UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
#   variables RELEASE_API_BASE_URL (https://api.<domain>), RELEASE_WEBSITE_BASE_URL (https://<domain>)
# A missing secret or variable stops the run before anything is built (rule 7): never a debug-signed or unsigned
# bundle, never a default address. The bundle is a workflow artifact for 14 days; the owner uploads it to the
# internal testing track by hand (no Play API key is kept here).
#
# Third-party actions are pinned to commit SHAs like deploy.yml (L-35): this workflow holds the upload key.
# A pull request that changes this file only runs actionlint on it (no secrets, no build).
name: Mobile release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name shown in Play and on the phone, e.g. 1.0.0
        type: string
        required: true
  pull_request:
    paths:
      - .github/workflows/mobile-release.yml

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Check the release workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint (with shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/mobile-release.yml

  build:
    name: Build signed AAB
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: play-release
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Refuse when the release settings are incomplete
        working-directory: .
        env:
          REF: ${{ github.ref }}
          VERSION_NAME: ${{ inputs.version_name }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          RELEASE_API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
          RELEASE_WEBSITE_BASE_URL: ${{ vars.RELEASE_WEBSITE_BASE_URL }}
        run: |
          set -euo pipefail
          failed=false
          if [[ "$REF" != refs/heads/main && "$REF" != refs/tags/v* ]]; then
            echo "::error title=Wrong ref::Build store releases only from main or a v* tag (this run is on $REF)."
            failed=true
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Version name::version_name must look like 1.0.0 (got '$VERSION_NAME')."
            failed=true
          fi
          missing=""
          for name in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::error title=Upload key missing::Secrets missing in the play-release environment:$missing (docs/runbooks/mobile-release.md, part 2)."
            failed=true
          fi
          for name in RELEASE_API_BASE_URL RELEASE_WEBSITE_BASE_URL; do
            if [[ ! "${!name:-}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
              echo "::error title=Address missing::Variable $name in the play-release environment must be https://<host> with no path (docs/runbooks/mobile-release.md, part 3)."
              failed=true
            fi
          done
          if [[ $failed == true ]]; then
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$store"
          chmod 600 "$store"
          # The key must open with the given passwords and alias before a 10-minute build starts.
          if ! keytool -list -keystore "$store" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" > /dev/null; then
            echo "::error title=Upload key unreadable::UPLOAD_KEYSTORE_BASE64 does not open with UPLOAD_KEYSTORE_PASSWORD, or holds no alias UPLOAD_KEY_ALIAS."
            exit 1
          fi
          expected=$(keytool -list -v -keystore "$store" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          {
            echo "FRESH_ORBIT_UPLOAD_STORE_FILE=$store"
            echo "FRESH_ORBIT_UPLOAD_STORE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD"
            echo "FRESH_ORBIT_UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
            echo "FRESH_ORBIT_UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
            echo "UPLOAD_CERT_SHA256=$expected"
          } >> "$GITHUB_ENV"

      - name: Build the app bundle
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
          API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
          WEBSITE_BASE_URL: ${{ vars.RELEASE_WEBSITE_BASE_URL }}
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" --build-number="$VERSION_CODE" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEBSITE_BASE_URL="$WEBSITE_BASE_URL"

      - name: Check the bundle is signed with the upload key
        id: aab
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ github.run_number }}
          API_BASE_URL: ${{ vars.RELEASE_API_BASE_URL }}
        run: |
          set -euo pipefail
          name="fresh-orbit-${VERSION_NAME}-${VERSION_CODE}.aab"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/out/$name"
          actual=$(keytool -printcert -jarfile "$GITHUB_WORKSPACE/out/$name" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [[ -z "$actual" || "$actual" != "$UPLOAD_CERT_SHA256" ]]; then
            echo "::error title=Wrong signature::The bundle is not signed with the upload key (bundle '$actual', key '$UPLOAD_CERT_SHA256')."
            exit 1
          fi
          size_bytes=$(stat -c %s "$GITHUB_WORKSPACE/out/$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Release bundle"
            echo "\`$name\`: version $VERSION_NAME, version code $VERSION_CODE, $((size_bytes / 1024 / 1024)) MB"
            echo "API: $API_BASE_URL"
            echo "Signed with the upload key, certificate SHA-256 \`$actual\` (the one Play Console shows as the upload key)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-aab
          path: out/${{ steps.aab.outputs.name }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove the decoded key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"
