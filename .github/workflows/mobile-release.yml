# Store build of the Android app for Google Play (D314, gap audit MA-7). Manual only: Actions › Mobile release ›
# Run workflow, on main.
#
# - A signed App Bundle (.aab) with the owner's upload key (D297); without the key secrets the run stops (rule 7:
#   never the debug key). Owner steps: docs/runbooks/mobile-release.md, part 2 and "Store build".
# - Dart code obfuscated (--obfuscate); the symbol files (--split-debug-info) are kept as a separate artifact for
#   90 days, so a stack trace from a crash report can be read back with `flutter symbolize`.
# - The version name comes from pubspec.yaml; the build number (Android versionCode) is the run number plus an
#   offset, so every upload is higher than the last one.
# - Addresses are repository variables, never defaults (rule 7): API_BASE_URL, WEBSITE_BASE_URL (D299),
#   APP_LINK_HOST (App Links, D308) and the optional CRASH_REPORT_DSN (D309).
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      build-number-offset:
        description: Added to the run number to give the build number (raise it if Play reports a used versionCode)
        required: false
        default: '100'

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Check the configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$API_BASE_URL" ] || missing="$missing vars.API_BASE_URL"
          [ -n "$WEBSITE_BASE_URL" ] || missing="$missing vars.WEBSITE_BASE_URL"
          [ -n "$UPLOAD_KEYSTORE_BASE64" ] || missing="$missing secrets.UPLOAD_KEYSTORE_BASE64"
          [ -n "$UPLOAD_KEYSTORE_PASSWORD" ] || missing="$missing secrets.UPLOAD_KEYSTORE_PASSWORD"
          [ -n "$UPLOAD_KEY_ALIAS" ] || missing="$missing secrets.UPLOAD_KEY_ALIAS"
          [ -n "$UPLOAD_KEY_PASSWORD" ] || missing="$missing secrets.UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Release not configured::Missing:$missing (docs/runbooks/mobile-release.md, Store build)."
            exit 1
          fi
      - name: Decode the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          store="$RUNNER_TEMP/fresh-orbit-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$store"
          {
            echo "FRESH_ORBIT_UPLOAD_STORE_FILE=$store"
            echo "FRESH_ORBIT_UPLOAD_STORE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD"
            echo "FRESH_ORBIT_UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS"
            echo "FRESH_ORBIT_UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build the App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
          CRASH_REPORT_DSN: ${{ vars.CRASH_REPORT_DSN }}
          FRESH_ORBIT_APP_LINK_HOST: ${{ vars.APP_LINK_HOST }}
          OFFSET: ${{ inputs.build-number-offset }}
        run: |
          build_number=$(( GITHUB_RUN_NUMBER + OFFSET ))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          flutter build appbundle --release \
            --build-number="$build_number" \
            --obfuscate --split-debug-info=build/debug-info \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=WEBSITE_BASE_URL="$WEBSITE_BASE_URL" \
            --dart-define=CRASH_REPORT_DSN="$CRASH_REPORT_DSN" \
            --dart-define=APP_ENVIRONMENT=Production
          {
            echo "### Store build"
            echo "Build number (versionCode): \`$build_number\`"
            [ -n "$FRESH_ORBIT_APP_LINK_HOST" ] || echo "App Links: not configured (vars.APP_LINK_HOST is empty), website links open the browser."
            [ -n "$CRASH_REPORT_DSN" ] || echo "Crash reports: device log only (vars.CRASH_REPORT_DSN is empty)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show the upload certificate (its SHA-256 goes into assetlinks.json only if Play App Signing is off)
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'SHA256' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        with:
          name: fresh-orbit-${{ env.BUILD_NUMBER }}-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: fresh-orbit-${{ env.BUILD_NUMBER }}-debug-info
          path: apps/mobile/build/debug-info
          if-no-files-found: error
          retention-days: 90
