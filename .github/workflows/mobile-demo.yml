# Demo Android app for the owner's phone (runbooks/owner-testing.md).
#
# Builds apps/mobile with --dart-define=DEMO=true: fixture data, no server needed. lib/main.dart refuses DEMO in a
# release build on a device, so this is a PROFILE build (not release, so DEMO is allowed; compiled ahead of time, so
# it is fast and much smaller than a debug build). Profile builds run on real phones (ARM), not on x86 emulators.
#
# Signing (D297, MA-15): profile builds use the debug signing config. When the repository secrets DEMO_KEYSTORE_BASE64,
# DEMO_KEYSTORE_PASSWORD, DEMO_KEY_ALIAS and DEMO_KEY_PASSWORD exist, the build signs with that one demo key, so a new
# APK installs over the previous one. Without them it falls back to the runner's throwaway debug key and says so in
# a warning and the run summary (the owner must uninstall the old APK first). Owner steps:
# docs/runbooks/mobile-release.md. The owner's release (upload) key is never used here.
#
# Policy links (D299): both APKs open the privacy policy, terms and the other policies on the demo website
# (vars.DEMO_WEB_ORIGIN, default below) through --dart-define=WEBSITE_BASE_URL.
#
# A second APK, `fresh-orbit-live-<sha>.apk`, is a profile build WITHOUT DEMO, pointed at the free Render demo API
# (vars.DEMO_API_ORIGIN, default below), so the owner sees the real sample catalogue, pictures, OTP sign-in and orders.
#
# Both APKs hold only the 64-bit ARM code (D321): the owner's phone download of the two-ABI APK (79 MB) kept stalling
# on mobile data; nearly every Android phone since 2019 is arm64, and 32-bit-only phones cannot install these builds.
#
# Every run uploads the APK as a workflow artifact. A manual run from main also publishes it as a GitHub
# prerelease `demo-apk-<short sha>`, so the owner can download it on the phone from the Releases page.
name: Mobile demo APK

on:
  workflow_dispatch:
  pull_request:
    # The Android project too: a manifest or Gradle change (App Links, backup rules, D308) is proven by a real build.
    paths:
      - .github/workflows/mobile-demo.yml
      - apps/mobile/android/**

concurrency:
  group: mobile-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build demo APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}
      live-name: ${{ steps.live.outputs.name }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Use the stable demo signing key
        env:
          DEMO_KEYSTORE_BASE64: ${{ secrets.DEMO_KEYSTORE_BASE64 }}
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_KEYSTORE_PASSWORD }}
          DEMO_KEY_ALIAS: ${{ secrets.DEMO_KEY_ALIAS }}
          DEMO_KEY_PASSWORD: ${{ secrets.DEMO_KEY_PASSWORD }}
        run: |
          if [ -z "$DEMO_KEYSTORE_BASE64" ]; then
            msg="The secret DEMO_KEYSTORE_BASE64 is not set, so these APKs are signed with this runner's throwaway debug key: a phone with an earlier demo APK must uninstall it first. Add the demo key secrets (docs/runbooks/mobile-release.md, part 1) to fix this."
            echo "::warning title=No demo signing key::$msg"
            echo "### Signing" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          missing=""
          [ -n "$DEMO_KEYSTORE_PASSWORD" ] || missing="$missing DEMO_KEYSTORE_PASSWORD"
          [ -n "$DEMO_KEY_ALIAS" ] || missing="$missing DEMO_KEY_ALIAS"
          [ -n "$DEMO_KEY_PASSWORD" ] || missing="$missing DEMO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Demo signing key incomplete::DEMO_KEYSTORE_BASE64 is set but these secrets are missing:$missing (docs/runbooks/mobile-release.md, part 1)."
            exit 1
          fi
          store="$RUNNER_TEMP/fresh-orbit-demo.jks"
          printf '%s' "$DEMO_KEYSTORE_BASE64" | base64 --decode > "$store"
          {
            echo "FRESH_ORBIT_DEMO_STORE_FILE=$store"
            echo "FRESH_ORBIT_DEMO_STORE_PASSWORD=$DEMO_KEYSTORE_PASSWORD"
            echo "FRESH_ORBIT_DEMO_KEY_ALIAS=$DEMO_KEY_ALIAS"
            echo "FRESH_ORBIT_DEMO_KEY_PASSWORD=$DEMO_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "### Signing" >> "$GITHUB_STEP_SUMMARY"
          echo "Signed with the stable demo key (secret DEMO_KEYSTORE_BASE64), so this APK installs over the previous one." >> "$GITHUB_STEP_SUMMARY"
      - name: Build profile APK with DEMO=true
        env:
          WEB_ORIGIN: ${{ vars.DEMO_WEB_ORIGIN || 'https://fresh-orbit-demo-web.onrender.com' }}
        run: flutter build apk --profile --dart-define=DEMO=true --dart-define=WEBSITE_BASE_URL="$WEB_ORIGIN" --target-platform android-arm64
      - name: Name and measure the APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          name="fresh-orbit-demo-${short_sha}.apk"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-profile.apk "$GITHUB_WORKSPACE/out/$name"
          size_bytes=$(stat -c %s "$GITHUB_WORKSPACE/out/$name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### Demo APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$name\`: $((size_bytes / 1024 / 1024)) MB ($size_bytes bytes)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build profile APK against the Render demo API
        env:
          API_ORIGIN: ${{ vars.DEMO_API_ORIGIN || 'https://fresh-orbit-demo-api.onrender.com' }}
          WEB_ORIGIN: ${{ vars.DEMO_WEB_ORIGIN || 'https://fresh-orbit-demo-web.onrender.com' }}
        run: flutter build apk --profile --dart-define=API_BASE_URL="$API_ORIGIN" --dart-define=WEBSITE_BASE_URL="$WEB_ORIGIN" --target-platform android-arm64
      - name: Name the live APK
        id: live
        run: |
          name="fresh-orbit-live-${GITHUB_SHA::7}.apk"
          cp build/app/outputs/flutter-apk/app-profile.apk "$GITHUB_WORKSPACE/out/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "\`$name\`: talks to the Render demo API" >> "$GITHUB_STEP_SUMMARY"
      - name: Show the signing certificates
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          echo "### Signing certificates (the same SHA-256 on every run means the APK installs over the last one)" >> "$GITHUB_STEP_SUMMARY"
          for apk in "$GITHUB_WORKSPACE"/out/*.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
            echo "\`$(basename "$apk")\`: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: A release build without the upload key is refused
        # MA-1 / D297: release builds never fall back to the debug key. This runner has no upload key, so the
        # release build must fail with the signing message.
        run: |
          if flutter build apk --release --target-platform android-arm64 > release.log 2>&1; then
            cat release.log
            echo "::error title=Release signing::A release APK was built without the upload key."
            exit 1
          fi
          if ! grep -q "Release signing is not configured" release.log; then
            cat release.log
            echo "::error title=Release signing::The release build failed for another reason than the missing upload key."
            exit 1
          fi
          grep -m1 "Release signing is not configured" release.log
      - uses: actions/upload-artifact@v7
        with:
          name: demo-apk
          path: |
            out/${{ steps.apk.outputs.name }}
            out/${{ steps.live.outputs.name }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish demo APK as a prerelease
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-apk
          path: out
      - name: Create or update the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: out/${{ needs.build.outputs.apk-name }}
          LIVE: out/${{ needs.build.outputs.live-name }}
        run: |
          tag="demo-apk-${GITHUB_SHA::7}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$APK" "$LIVE" --clobber
          else
            gh release create "$tag" "$APK" "$LIVE" --prerelease --target "$GITHUB_SHA" \
              --title "Demo app ${GITHUB_SHA::7}" \
              --notes "Two Android apps: fresh-orbit-live-*.apk uses the free Render demo server (real sample pictures, OTP sign-in, orders; the first open can take a minute while the server wakes); fresh-orbit-demo-*.apk uses built-in sample data, no server. Open this page on the phone, tap the .apk file under Assets, then allow installs from your browser. Steps: docs/runbooks/owner-testing.md."
          fi
