name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs a job only when its part of the repository changed, to save Actions minutes (D253). A skipped job counts as
  # passed. Changes to this workflow, or a push with no usable base, run everything.
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      openapi: ${{ steps.diff.outputs.openapi }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          all() { for k in backend frontend openapi mobile; do echo "$k=true" >> "$GITHUB_OUTPUT"; done; }
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then all; exit 0; fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          if echo "$files" | grep -q '^\.github/workflows/ci\.yml$'; then all; exit 0; fi
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          echo "backend=$(has '^(backend/|global\.json)')" >> "$GITHUB_OUTPUT"
          echo "frontend=$(has '^(apps/web/|apps/admin/|packages/[^f]|package\.json|pnpm-|tsconfig|\.prettier|eslint)')" >> "$GITHUB_OUTPUT"
          echo "openapi=$(has '^(backend/src/|packages/api-client/)')" >> "$GITHUB_OUTPUT"
          echo "mobile=$(has '^(apps/mobile/|packages/flutter/|packages/illustrations/)')" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The Release build plus one Postgres container per test assembly ran the runner out of disk; drop unused toolchains.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Validate sample data
        run: python3 backend/data/sample/tools/validate.py
      - name: Restore
        run: dotnet restore backend/FreshOrbit.slnx
      - name: Build
        run: dotnet build backend/FreshOrbit.slnx --no-restore -c Release
      # Testcontainers' database image, pulled once before the test assemblies start in parallel (they failed with
      # "No such image: postgres:17-alpine" when each tried to pull it), from Google's Docker Hub mirror.
      - name: Pull the test database image
        run: |
          for attempt in 1 2 3; do
            docker pull mirror.gcr.io/library/postgres:17-alpine && break
            sleep 10
          done
          docker tag mirror.gcr.io/library/postgres:17-alpine postgres:17-alpine
          df -h /
      - name: Test
        run: dotnet test backend/FreshOrbit.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list backend/FreshOrbit.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q -E "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend packages build, lint and test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  # Regenerates the API client from the real OpenAPI document (the local procedure of docs/design/admin.md §4, run on
  # the runner because the dev Mac runs no tools). Download the `api-client` artifact and commit it when it differs.
  openapi:
    name: OpenAPI document and API client types
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: freshorbit
          POSTGRES_USER: freshorbit
          POSTGRES_PASSWORD: freshorbit_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshorbit" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Api
        run: dotnet build backend/src/Hosts/FreshOrbit.Api -c Release
      - name: Start the Api in Development
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          nohup dotnet run --project backend/src/Hosts/FreshOrbit.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5080/openapi/v1.json && exit 0; sleep 2; done
          cat api.log; exit 1
      - run: pnpm --filter @fresh/api-client fetch-spec
      - run: pnpm generate:api
      - name: Show whether the committed client is current
        run: git diff --stat -- packages/api-client
      - uses: actions/upload-artifact@v7
        with:
          name: api-client
          path: |
            packages/api-client/openapi.json
            packages/api-client/src/schema.d.ts

  mobile:
    name: Mobile app analyze and test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
