name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The Release build plus one Postgres container per test assembly ran the runner out of disk; drop unused toolchains.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Validate sample data
        run: python3 backend/data/sample/tools/validate.py
      - name: Restore
        run: dotnet restore backend/FreshOrbit.slnx
      - name: Build
        run: dotnet build backend/FreshOrbit.slnx --no-restore -c Release
      # Testcontainers' database image, pulled once before the test assemblies start in parallel (they failed with
      # "No such image: postgres:17-alpine" when each tried to pull it), from Google's Docker Hub mirror.
      - name: Pull the test database image
        run: |
          for attempt in 1 2 3; do
            docker pull mirror.gcr.io/library/postgres:17-alpine && break
            sleep 10
          done
          docker tag mirror.gcr.io/library/postgres:17-alpine postgres:17-alpine
          df -h /
      - name: Test
        run: dotnet test backend/FreshOrbit.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list backend/FreshOrbit.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q -E "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend packages build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  # Regenerates the API client from the real OpenAPI document (the local procedure of docs/design/admin.md §4, run on
  # the runner because the dev Mac runs no tools). Download the `api-client` artifact and commit it when it differs.
  openapi:
    name: OpenAPI document and API client types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: freshorbit
          POSTGRES_USER: freshorbit
          POSTGRES_PASSWORD: freshorbit_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freshorbit" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Api
        run: dotnet build backend/src/Hosts/FreshOrbit.Api -c Release
      - name: Start the Api in Development
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          nohup dotnet run --project backend/src/Hosts/FreshOrbit.Api -c Release --no-build --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:5080/openapi/v1.json && exit 0; sleep 2; done
          cat api.log; exit 1
      - run: pnpm --filter @fresh/api-client fetch-spec
      - run: pnpm generate:api
      - name: Show whether the committed client is current
        run: git diff --stat -- packages/api-client
      - uses: actions/upload-artifact@v4
        with:
          name: api-client
          path: |
            packages/api-client/openapi.json
            packages/api-client/src/schema.d.ts

  mobile:
    name: Mobile app analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
