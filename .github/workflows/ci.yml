name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Validate sample data
        run: python3 backend/data/sample/tools/validate.py
      - name: Restore
        run: dotnet restore backend/FreshOrbit.slnx
      - name: Build
        run: dotnet build backend/FreshOrbit.slnx --no-restore -c Release
      # Testcontainers' database image, pulled once before the test assemblies start in parallel (they failed with
      # "No such image: postgres:17-alpine" when each tried to pull it), from Google's Docker Hub mirror.
      - name: Pull the test database image
        run: |
          for attempt in 1 2 3; do
            docker pull mirror.gcr.io/library/postgres:17-alpine && break
            sleep 10
          done
          docker tag mirror.gcr.io/library/postgres:17-alpine postgres:17-alpine
      - name: Test
        run: dotnet test backend/FreshOrbit.slnx --no-build -c Release --logger "trx" --results-directory TestResults
      - name: Vulnerable packages
        run: dotnet list backend/FreshOrbit.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q -E "has the following vulnerable packages" vuln.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  frontend:
    name: Frontend packages build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check

  mobile:
    name: Mobile app analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
