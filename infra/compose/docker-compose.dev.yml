# Local development services: PostgreSQL 17, MinIO (S3-compatible image storage), Mailpit (SMTP catcher).
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
# Host ports can be changed with POSTGRES_PORT, MINIO_API_PORT, MINIO_CONSOLE_PORT, MAILPIT_SMTP_PORT and
# MAILPIT_UI_PORT when the defaults are taken (then point ConnectionStrings__FreshOrbit at the new port).
name: freshorbit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freshorbit
      POSTGRES_USER: freshorbit
      POSTGRES_PASSWORD: freshorbit_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshorbit -d freshorbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official minio/minio images are no longer published on Docker Hub / quay.io; this is the frozen
    # Bitnami build of MinIO (AGPL-3.0, S3 API). Replace when the team picks a maintained S3-compatible image.
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: freshorbit
      MINIO_ROOT_PASSWORD: freshorbit_dev
      MINIO_DEFAULT_BUCKETS: freshorbit-images
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  minio-data:
