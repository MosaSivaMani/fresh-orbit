# Local development services: PostgreSQL 17, Mailpit (SMTP catcher). Product images are files on local disk
# (FileStorage__RootPath, served by the Api at /media/*; decision D21), so no object store runs here.
#   docker compose -f infra/compose/docker-compose.dev.yml up -d
# Host ports can be changed with POSTGRES_PORT, MAILPIT_SMTP_PORT and MAILPIT_UI_PORT when the defaults are taken
# (then point ConnectionStrings__FreshOrbit at the new port).
name: freshorbit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: freshorbit
      POSTGRES_USER: freshorbit
      POSTGRES_PASSWORD: freshorbit_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshorbit -d freshorbit"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
