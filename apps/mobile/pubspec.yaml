name: fresh_orbit_app
description: "Fresh Orbit customer app (Android and iOS). Business values come from the API; the app renders them."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

# Versions are pinned exactly (no caret). Licences are listed in docs/design/mobile.md.
dependencies:
  flutter:
    sdk: flutter
  dio: 5.11.1
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  fresh_theme:
    path: ../../packages/flutter/fresh_theme
  go_router: 18.1.1
  intl: 0.20.3
  shared_preferences: 2.5.6
  uuid: 4.6.0
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  # Illustrations (D53): <slot_lower_snake>.png (or .webp, or a full-scene .jpg resized to 1024 px), copied here by the `packages/illustrations` sync-mobile
  # script. Missing files fall back to the drawn placeholder (lib/illustrations/illustration.dart).
  assets:
    - assets/illustrations/
    - assets/brand/

  # Inter (body) and Baloo 2 (headings), SIL Open Font License 1.1 (assets/fonts/*-OFL.txt). Static instances
  # cut from the Google Fonts variable fonts and subset to Latin, Latin Extended and the rupee sign.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
    # Dancing Script (handwritten lines, D89), SIL Open Font License 1.1 (assets/fonts/DancingScript-OFL.txt): the
    # Google Fonts variable font; the 700 weight is picked with FontVariation('wght', 700) in scriptStyle.
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Variable.ttf
